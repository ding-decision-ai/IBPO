defaults:
  - ppo_trainer
  - _self_

data:
  train_files: null
  val_files: null
  max_prompt_length: 16384
  max_response_length: 4096
  train_batch_size: 32

actor_rollout_ref:
  model:
    path: Qwen/Qwen3-32B
    use_remove_padding: false
    override_config:
      attn_implementation: sdpa
  actor:
    strategy: fsdp2
    policy_loss:
      loss_mode: gspo
    loss_agg_mode: seq-mean-token-mean
    use_kl_loss: false
    entropy_coeff: 0
    ppo_mini_batch_size: ${data.train_batch_size}
    ppo_epochs: 1
    ppo_micro_batch_size_per_gpu: 1
    clip_ratio: 0.2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    optim:
      lr: 5.0e-7
      lr_scheduler_type: cosine
      min_lr_ratio: 0.1
      lr_warmup_steps: -1
      lr_warmup_steps_ratio: 0.03
    fsdp_config:
      strategy: fsdp2
      ulysses_sequence_parallel_size: 1
      use_torch_compile: false
  ref:
    strategy: fsdp2
    fsdp_config:
      strategy: fsdp2
      ulysses_sequence_parallel_size: 1
      use_torch_compile: false
  rollout:
    name: vllm
    # Correction conditions contain the original question and both complete responses.
    # This carrier capacity is separate from the original-question filter above.
    prompt_length: 28672
    max_model_len: 32768
    n: 8
    temperature: 1.0
    top_p: 1.0
    log_prob_micro_batch_size_per_gpu: 1
    multi_turn:
      enable: false

algorithm:
  adv_estimator: ibpo
  use_kl_in_reward: false

reward:
  custom_reward_function:
    path: pkg://recipe.ibpo.reward
    name: compute_score
  reward_model:
    enable: false

trainer:
  # Four nodes with eight GPUs is an example layout of the paper's 32 GPUs.
  nnodes: 4
  n_gpus_per_node: 8
  val_before_train: false
  test_freq: -1
  project_name: verl-ibpo
  experiment_name: ibpo-fixed
  balance_batch: true

# The operator's unspecified settings below remain explicit engineering choices.
ibpo:
  k: 2
  variant: fixed
  shaping_weight: 0.6
  rho: 0.5
  rewrite_threshold: 0.5
  correction_n: 2
  aux_weight: 1.0
  mask_fallback: null
  seed: 42
